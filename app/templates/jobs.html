<!-- templates/users.html -->
{% extends 'master.html' %}

{% block title %}Jobs | Your Space{% endblock %}

{% block content %}
    <h1>Jobs Management</h1>

    <div class="table-responsive">
        <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.id }}</td>
                <td>{{ job.name }}</td>
                <td>
                    <!-- Add the links to edit and delete users -->
                    <a href="#" class="edit-job-btn" data-toggle="modal" data-target="#editJobModal" data-job-id="{{ job.id }}" title="Edit Job">
                        <span class="material-symbols-outlined">edit</span>
                    </a>
                    <a href="{{ url_for('delete_job', job_id=job.id) }}" onclick="return confirm('Are you sure you want to delete this job?');" title="Delete Job">
                        <span class="material-symbols-outlined">delete</span>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
        </table>
    </div>

    <!-- Add new user link -->
    <a href="{{ url_for('add_job') }}" class="btn btn-primary">Add New Job</a>

<!-- Edit Job Modal -->
<div class="modal fade" id="editJobModal" tabindex="-1" role="dialog" aria-labelledby="editJobModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editJobModalLabel">Edit Job</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Form will be loaded here by JavaScript -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function () {
        // Handle the modal display for editing a job
        $('#editJobModal').on('show.bs.modal', function (event) {
            var button = $(event.relatedTarget); // Button that triggered the modal
            var jobId = button.data('job-id'); // Extract info from data-* attributes
            var modal = $(this);

            // AJAX request to get the edit form
            $.ajax({
                url: '/edit_job_form/' + jobId,
                type: 'GET',
                success: function (response) {
                    modal.find('.modal-body').html(response);
                },
                error: function (xhr, status, error) {
                    var errorMessage = 'Error loading job data. ';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMessage += xhr.responseJSON.error;
                    } else {
                        errorMessage += 'Please try again later.';
                    }
                    modal.find('.modal-body').html('<div class="alert alert-danger">' + errorMessage + '</div>');
                }
            });
        });
    });
</script>
{% endblock %}
